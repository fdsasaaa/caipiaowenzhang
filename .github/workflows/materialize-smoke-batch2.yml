name: materialize-smoke-batch2

on:
  pull_request:
    paths:
      - 'scripts/materialize_smoke_batch2_packages.py'
      - '.github/workflows/materialize-smoke-batch2.yml'

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Print exact approved packages
        run: PYTHONPATH=. python scripts/materialize_smoke_batch2_packages.py
