name: controller-200-post-lifecycle-capacity-temp

on:
  push:
    branches:
      - fix/production-controller-candidate-lifecycle-v2
    paths:
      - .github/controller-200-post-lifecycle-capacity.trigger

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit and prove target-200 capacity without provider calls
        run: |
          set -euo pipefail
          python -m engine.cli audit
          rm -rf runs/controller-200-post-lifecycle-capacity
          python scripts/produce_articles_total.py 200 --output-dir runs/controller-200-post-lifecycle-capacity | tee controller-200-post-lifecycle-capacity.log
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('runs/controller-200-post-lifecycle-capacity/plan.json').read_text(encoding='utf-8'))
          assert plan['candidate_capacity_current_snapshot'] >= 200, plan['candidate_capacity_current_snapshot']
          assert plan['target_feasible_current_snapshot'] is True
          assert plan['capacity_exhaustive'] is True
          preview=plan.get('candidate_preview',[])
          assert all(set(row.get('technique_atoms') or []) != {'position_filter'} for row in preview)
          print(json.dumps({
              'candidate_capacity':plan['candidate_capacity_current_snapshot'],
              'capacity_exhaustive':plan['capacity_exhaustive'],
              'capacity_probe_passes':plan.get('capacity_probe_passes'),
              'attempt_budget':plan['attempt_budget'],
              'provider_calls':0,
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: controller-200-post-lifecycle-capacity
          path: |
            runs/controller-200-post-lifecycle-capacity/
            controller-200-post-lifecycle-capacity.log
          if-no-files-found: error
