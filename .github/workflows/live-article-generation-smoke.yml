name: live-article-generation-smoke

on:
  push:
    paths:
      - '.github/live-article-generation-smoke.trigger'

permissions:
  contents: read

jobs:
  generate-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      OPENAI_BASE_URL: https://api.synapai.top/v1
      OPENAI_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify secret exists without printing it
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "MODEL_PROVIDER_API_KEY secret is not configured" >&2
            exit 2
          fi
          echo "API key secret detected; value will not be printed."
      - name: Generate one V2.1 article and run Approval
        shell: bash
        run: python scripts/live_article_generation_smoke_v21.py
