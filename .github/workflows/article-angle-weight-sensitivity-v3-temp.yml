name: article-angle-weight-sensitivity-v3-temp

on:
  push:
    branches:
      - research/article-angle-capacity-v1
    paths:
      - '.github/article-angle-weight-sensitivity-v3.trigger'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare audited information-gain weights without changing thresholds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from collections import Counter
          from pathlib import Path

          from engine.dedup import _core, duplicate_candidates
          from engine.semantic_dedup import structural_duplicate_candidates, structural_similarity
          from engine.seo_keywords import keyword_owners, normalize_keyword
          from engine.text import jaccard
          from scripts.produce_articles_total import _build_plan_with_capacity_retry

          LEX=0.72
          STRUCT=0.82
          TARGET=199
          WEIGHTS=(0.0,0.10,0.15,0.20,0.25)
          ANGLES=('mechanics_case','space_math','execution_checklist','parameter_boundary','multistage_order','sample_provenance')
          SUFFIX={'mechanics_case':'技巧','space_math':'注数计算','execution_checklist':'筛选步骤','parameter_boundary':'参数设置','multistage_order':'筛选顺序','sample_provenance':'演示案例'}
          APR={name:i for i,name in enumerate(ANGLES)}

          plan=_build_plan_with_capacity_retry(TARGET,provider_id='',signals=[],batch_size=25,allow_ultra=False)
          bases=list(plan['candidates'])
          assert plan['formal_inventory_before']==1 and plan['capacity_exhaustive'] is True

          def result(bp): return ((bp.get('production_filter_contract') or {}).get('filter_pipeline_result') or {})
          def stages(bp): return list(result(bp).get('stages') or [])
          def sample_stage(s): return s.get('support_mode')=='synthetic_case_calculation'
          def has_sample(bp): return any(sample_stage(s) for s in stages(bp))
          def chain(bp): return '→'.join(str(s.get('label') or s.get('atom') or '') for s in stages(bp))
          def counts(bp):
              r=result(bp); return int(r.get('starting_space') or 0),int(r.get('final_space') or 0),int(r.get('total_excluded') or 0)
          def psig(bp):
              bits=[]
              for s in stages(bp):
                  p=s.get('params') or {}; safe=[]
                  for k in ('min','max','odd_count','big_count','has_repeat','pair_difference','lookback','top_n','threshold'):
                      if k in p: safe.append(f'{k}={p[k]}')
                  mode='sample' if sample_stage(s) else 'static'
                  bits.append(f"{s.get('atom')}[{','.join(safe)}/{mode}]:{s.get('before_space')}->{s.get('after_space')}")
              return '>'.join(bits)
          def allowed(bp):
              out=['mechanics_case','space_math','execution_checklist','parameter_boundary']
              if len(stages(bp))>=2: out.append('multistage_order')
              if has_sample(bp): out.append('sample_provenance')
              return out
          def stem(bp):
              kw=str(bp.get('primary_keyword') or '')
              return kw[:-2] if kw.endswith('技巧') else kw
          def vid(bp,a):
              if a=='mechanics_case': return str(bp.get('article_id'))
              raw=f"{bp.get('fingerprint')}|angle={a}|v1"
              return 'LCM-ANGLE-'+hashlib.sha256(raw.encode()).hexdigest()[:16]
          def identity(bp,a,kw):
              ss=stages(bp); n=len(ss); c=chain(bp); start,final,excluded=counts(bp)
              if a=='mechanics_case': return f"{kw}：{c}具体怎么算，用一个完整案例从{start}复算到{final}",f"理解{bp.get('subject_play')}里{c}分别计算什么，并用固定演示案例完整复算一次"
              if a=='space_math': return f"{kw}：{start}个候选为什么变成{final}个，排除{excluded}个怎么算",f"核对{bp.get('subject_play')}的候选空间计算，逐项确认{start}到{final}以及排除{excluded}个的确定性结果"
              if a=='execution_checklist': return f"{kw}：实际操作按哪几步做，筛到{final}个后什么时候必须停止",f"按固定顺序执行{c}，检查参数、候选空间和停止条件，形成可重复的人工操作清单"
              if a=='parameter_boundary': return f"{kw}：哪些参数先冻结，哪些数字只能由演示样本算出来",f"区分{bp.get('subject_play')}中系统预设参数与样本衍生结果，明确哪些条件生成前固定、哪些结果不能事后改"
              if a=='multistage_order': return f"{kw}：{n}层为什么按{c}这个顺序，逐层各排除多少",f"复算{n}层筛选的固定顺序、每层before/after/excluded，并说明完成最后一层后为什么停止"
              s=[x for x in ss if sample_stage(x)][0]; p=s.get('params') or {}; look=p.get('lookback') or 12
              return f"{kw}：近{look}期演示数据怎样生成数字池，为什么不能当成预测",f"只用演示样本复算{s.get('label')}的数字池和空间变化，并区分样本计算、玩法规则与预测结论"
          def variant(base,a):
              bp=copy.deepcopy(base['blueprint']); kw=stem(bp)+SUFFIX[a]; title,intent=identity(bp,a,kw); start,final,excluded=counts(bp)
              bp['article_id']=vid(bp,a); bp['blueprint_id']='BP-'+bp['article_id'].split('-')[-1]
              bp['primary_keyword']=kw; bp['title']=title; bp['search_intent']=intent; bp['information_gain_type']=a
              bp['article_angle_contract_version']='1.0'; bp['angle_deliverable']=a
              bp['case_structure']=str(bp.get('case_structure') or '')+f";angle={a};pipeline={psig(bp)};start={start};final={final};excluded={excluded}"
              return {'priority_score':base['priority_score'],'angle_priority':APR[a],'blueprint':bp}

          variants=[variant(base,a) for base in bases for a in allowed(base['blueprint'])]
          keyword_seen={}; eligible=[]; current_blocked=[]; pool_keyword_blocked=[]
          for row in variants:
              bp=row['blueprint']; key=normalize_keyword(bp['primary_keyword'])
              if keyword_owners(bp['primary_keyword'],exclude_article_id=bp['article_id']): current_blocked.append(('keyword',bp['article_id'])); continue
              if key in keyword_seen and keyword_seen[key]!=bp['article_id']: pool_keyword_blocked.append(bp['article_id']); continue
              keyword_seen[key]=bp['article_id']
              lex=duplicate_candidates(bp,threshold=LEX); st=structural_duplicate_candidates(bp,threshold=STRUCT)
              if lex or st: current_blocked.append(('lexical' if lex else 'structural',bp['article_id'])); continue
              eligible.append(row)

          ordered=sorted(eligible,key=lambda r:(-float(r['priority_score']),r['angle_priority'],r['blueprint']['article_id']))
          studies=[]
          for weight in WEIGHTS:
              selected=[]; conflicts=[]
              for row in ordered:
                  bp=row['blueprint']; conflict=None
                  for chosen in selected:
                      old=chosen['blueprint']; lex=jaccard(_core(bp),_core(old))
                      if lex>=LEX: conflict=('lexical',lex,old); break
                      base_score,_=structural_similarity(bp,old)
                      same_angle=(bp.get('information_gain_type')==old.get('information_gain_type'))
                      score=(1-weight)*base_score + weight*(1.0 if same_angle else 0.0)
                      if score>=STRUCT: conflict=('structural',score,old); break
                  if conflict:
                      conflicts.append({'article_id':bp['article_id'],'angle':bp['information_gain_type'],'gate':conflict[0],'score':round(float(conflict[1]),4),'owner_article_id':conflict[2]['article_id'],'owner_angle':conflict[2]['information_gain_type']})
                  else: selected.append(row)
              cross=sum(1 for x in conflicts if x['angle']!=x['owner_angle'])
              studies.append({
                  'angle_weight':weight,'selected':len(selected),'target_feasible':len(selected)>=TARGET,
                  'margin_vs_199':len(selected)-TARGET,'conflicts':len(conflicts),'cross_angle_conflicts':cross,
                  'same_angle_conflicts':len(conflicts)-cross,'conflict_gates':dict(Counter(x['gate'] for x in conflicts)),
                  'angle_distribution':dict(Counter(x['blueprint']['information_gain_type'] for x in selected)),
              })

          payload={'formal_inventory_before':plan['formal_inventory_before'],'base_candidates':len(bases),'variants':len(variants),'eligible':len(eligible),'current_blocked':len(current_blocked),'pool_keyword_blocked':len(pool_keyword_blocked),'thresholds':{'lexical':LEX,'structural':STRUCT},'provider_calls':0,'studies':studies}
          Path('article-angle-weight-sensitivity-v3.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: article-angle-weight-sensitivity-v3
          path: article-angle-weight-sensitivity-v3.json
          retention-days: 30
