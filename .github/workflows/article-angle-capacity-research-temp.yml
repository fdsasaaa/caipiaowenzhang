name: article-angle-capacity-research-temp

on:
  push:
    branches:
      - research/article-angle-capacity-v1
    paths:
      - '.github/article-angle-capacity-research.trigger'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Audit inherited V6 state
        run: |
          python -m engine.cli audit
          python scripts/audit_reader_terminology.py --root .

      - name: Simulate deterministic information-gain identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json
          from collections import Counter
          from pathlib import Path

          from engine.dedup import _core, duplicate_candidates
          from engine.semantic_dedup import structural_duplicate_candidates, structural_similarity
          from engine.text import jaccard
          from scripts.produce_articles_total import _build_plan_with_capacity_retry

          LEX=0.72
          STRUCT=0.82
          TARGET=199

          plan=_build_plan_with_capacity_retry(TARGET,provider_id='',signals=[],batch_size=25,allow_ultra=False)
          rows=list(plan['candidates'])
          assert plan['capacity_exhaustive'] is True, plan
          assert plan['formal_inventory_before']==1, plan

          def stages(bp):
              return list(((bp.get('production_filter_contract') or {}).get('filter_pipeline_result') or {}).get('stages') or [])

          def stage_kind(stage):
              return 'sample' if stage.get('support_mode')=='synthetic_case_calculation' else 'static'

          def overall_kind(bp):
              kinds={stage_kind(s) for s in stages(bp)}
              if kinds=={'sample'}: return 'sample_only'
              if kinds=={'static'}: return 'static_only'
              return 'mixed'

          def pipeline_counts(bp):
              r=((bp.get('production_filter_contract') or {}).get('filter_pipeline_result') or {})
              return int(r.get('starting_space') or 0), int(r.get('final_space') or 0), int(r.get('total_excluded') or 0)

          def labels(bp):
              return [str(s.get('label') or s.get('atom') or '') for s in stages(bp)]

          def params_signature(stage):
              p=stage.get('params') or {}
              keep=[]
              for k in ('min','max','odd_count','big_count','has_repeat','pair_difference','lookback','top_n','threshold'):
                  if k in p:
                      keep.append(f'{k}={p[k]}')
              return ','.join(keep)

          def machine_signature(bp):
              ss=stages(bp)
              parts=[]
              for s in ss:
                  parts.append(
                      f"{s.get('atom')}[{params_signature(s)}]:{s.get('before_space')}->{s.get('after_space')}"
                  )
              return '>'.join(parts)

          def user_task(bp):
              ss=stages(bp)
              start,final,excluded=pipeline_counts(bp)
              if len(ss)==1:
                  s=ss[0]
                  if stage_kind(s)=='sample':
                      p=s.get('params') or {}
                      lookback=p.get('lookback') or 12
                      topn=p.get('top_n')
                      if s.get('atom')=='omission_threshold':
                          threshold=p.get('threshold')
                          return f"近{lookback}期演示样本怎样按遗漏阈值{threshold}重建数字池，并从{start}个候选复算到{final}个"
                      return f"近{lookback}期演示样本怎样按频率规则构造Top-{topn}数字池，并从{start}个候选复算到{final}个"
                  return f"{s.get('label')}怎样从{start}个候选筛到{final}个，并核对排除的{excluded}个组合"
              kinds=overall_kind(bp)
              chain='→'.join(labels(bp))
              if kinds=='mixed':
                  return f"怎样区分系统预设参数和演示样本结果，再按{chain}逐层从{start}个复算到{final}个"
              return f"怎样按{chain}的固定顺序逐层复算，并核对每层从{start}个到最终{final}个的缩减"

          def transformed(bp, strategy):
              x=copy.deepcopy(bp)
              start,final,excluded=pipeline_counts(x)
              chain='→'.join(labels(x))
              task=user_task(x)
              pk=str(x.get('primary_keyword') or '')
              if strategy=='baseline':
                  return x
              if strategy=='machine_title_intent':
                  x['title']=f"{pk}：{chain}怎么把{start}个候选筛到{final}个"
                  x['search_intent']=task
                  return x
              if strategy=='machine_pipeline_identity':
                  x['title']=f"{pk}：{chain}怎么把{start}个候选筛到{final}个"
                  x['search_intent']=task
                  x['case_structure']=str(x.get('case_structure') or '') + f";pipeline={machine_signature(x)};evidence={overall_kind(x)}"
                  return x
              if strategy=='reader_task_contract':
                  ss=stages(x)
                  if len(ss)==1 and stage_kind(ss[0])=='static':
                      headline=f"{labels(x)[0]}到底排除多少组合？{start}到{final}完整复算"
                  elif len(ss)==1:
                      headline=f"演示样本数字池怎么生成？{start}到{final}按固定规则复算"
                  elif overall_kind(x)=='mixed':
                      headline=f"静态条件和样本数字池怎么分开算？{len(ss)}层从{start}到{final}"
                  else:
                      headline=f"{len(ss)}层筛选顺序为什么不能换？从{start}到{final}逐层复算"
                  x['title']=f"{pk}：{headline}"
                  x['search_intent']=task
                  x['information_gain_type']=(
                      'single_stage_static_space_reduction' if len(ss)==1 and overall_kind(x)=='static_only' else
                      'single_stage_sample_pool_reproduction' if len(ss)==1 else
                      'multistage_mixed_provenance_reproduction' if overall_kind(x)=='mixed' else
                      'multistage_ordered_space_reduction'
                  )
                  x['case_structure']=str(x.get('case_structure') or '') + (
                      f";reader_task={x['information_gain_type']};pipeline={machine_signature(x)};"
                      f"start={start};final={final};excluded={excluded};evidence={overall_kind(x)}"
                  )
                  return x
              raise AssertionError(strategy)

          def evaluate(strategy):
              transformed_rows=[]
              current_blocked=[]
              for row in rows:
                  bp=transformed(row['blueprint'],strategy)
                  lexical=duplicate_candidates(bp, threshold=LEX)
                  structural=structural_duplicate_candidates(bp, threshold=STRUCT)
                  if lexical or structural:
                      hit=(lexical[0] if lexical else structural[0])
                      current_blocked.append({
                          'article_id':bp.get('article_id'),
                          'primary_keyword':bp.get('primary_keyword'),
                          'gate':'lexical' if lexical else 'structural',
                          'owner_article_id':hit.article_id,
                          'score':round(float(hit.score),4),
                      })
                  else:
                      transformed_rows.append({'priority_score':row['priority_score'],'blueprint':bp})

              selected=[]
              conflicts=[]
              for row in transformed_rows:
                  bp=row['blueprint']
                  conflict=None
                  for chosen in selected:
                      old=chosen['blueprint']
                      if bp.get('fingerprint') and bp.get('fingerprint')==old.get('fingerprint'):
                          conflict=('fingerprint',1.0,old.get('article_id'))
                          break
                      lex=jaccard(_core(bp),_core(old))
                      if lex>=LEX:
                          conflict=('lexical',lex,old.get('article_id'))
                          break
                      structural,_=structural_similarity(bp,old)
                      if structural>=STRUCT:
                          conflict=('structural',structural,old.get('article_id'))
                          break
                  if conflict:
                      conflicts.append({
                          'article_id':bp.get('article_id'),
                          'primary_keyword':bp.get('primary_keyword'),
                          'subject_play':bp.get('subject_play'),
                          'technique_atoms':bp.get('technique_atoms'),
                          'gate':conflict[0],
                          'score':round(float(conflict[1]),4),
                          'owner_article_id':conflict[2],
                      })
                  else:
                      selected.append(row)
              return {
                  'strategy':strategy,
                  'raw':len(rows),
                  'current_registry_blocked':len(current_blocked),
                  'eligible_after_current_registry':len(transformed_rows),
                  'sustainable_greedy':len(selected),
                  'target_199_feasible':len(selected)>=TARGET,
                  'intra_pool_conflicts':len(conflicts),
                  'conflict_gates':dict(Counter(x['gate'] for x in conflicts)),
                  'selected_modes':dict(Counter(
                      str((x['blueprint'].get('production_filter_contract') or {}).get('mode') or '')
                      for x in selected
                  )),
                  'selected_plays':dict(Counter(str(x['blueprint'].get('subject_play') or '') for x in selected)),
                  'current_blocked_rows':current_blocked,
                  'conflicts':conflicts,
                  'selected_preview':[
                      {
                          'article_id':x['blueprint'].get('article_id'),
                          'title':x['blueprint'].get('title'),
                          'search_intent':x['blueprint'].get('search_intent'),
                          'case_structure':x['blueprint'].get('case_structure'),
                      }
                      for x in selected[:20]
                  ],
              }

          strategies=['baseline','machine_title_intent','machine_pipeline_identity','reader_task_contract']
          results=[evaluate(s) for s in strategies]
          summary=[{k:v for k,v in r.items() if k not in {'current_blocked_rows','conflicts','selected_preview'}} for r in results]
          payload={
              'formal_inventory_before':plan['formal_inventory_before'],
              'raw_candidate_capacity':plan['candidate_capacity_current_snapshot'],
              'capacity_exhaustive':plan['capacity_exhaustive'],
              'thresholds':{'lexical':LEX,'structural':STRUCT},
              'provider_calls':0,
              'strategies':results,
          }
          Path('article-angle-capacity-research.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: article-angle-capacity-research
          path: article-angle-capacity-research.json
          retention-days: 30
