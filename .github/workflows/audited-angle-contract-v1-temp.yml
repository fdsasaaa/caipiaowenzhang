name: audited-angle-contract-v1-temp

on:
  push:
    branches:
      - feature/audited-article-angle-contract-v1
    paths:
      - '.github/audited-angle-contract-v1.trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pytest

      - name: Apply audited angle integration patch
        run: python scripts/_temp_apply_audited_angle_contract_v1.py

      - name: Compile patched engine
        run: python -m compileall -q engine scripts tests

      - name: Run angle and integration regressions
        run: >-
          python -m pytest -q
          tests/test_article_angles.py
          tests/test_article_angle_dedup.py
          tests/test_article_angle_quality.py
          tests/test_planner.py
          tests/test_blueprints.py
          tests/test_draft_packets.py
          tests/test_ai_generation.py
          tests/test_approval.py
          tests/test_semantic_dedup_v2.py
          tests/test_production_controller.py

      - name: Run full offline CI
        shell: bash
        run: |
          set -euo pipefail
          python -m engine.cli audit
          python scripts/audit_reader_terminology.py --root .
          python -m pytest -q

      - name: Measure formal implementation capacity with unchanged dedup thresholds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from engine.dedup import LEXICAL_DUPLICATE_THRESHOLD, lexical_similarity
          from engine.semantic_dedup import STRUCTURAL_DUPLICATE_THRESHOLD, structural_similarity
          from scripts.produce_articles_total import _build_plan_with_capacity_retry

          plan=_build_plan_with_capacity_retry(200,provider_id='',signals=[],batch_size=25,allow_ultra=False)
          candidates=list(plan['candidates'])
          conflicts=[]
          for i,row in enumerate(candidates):
              bp=row['blueprint']
              for oldrow in candidates[:i]:
                  old=oldrow['blueprint']
                  lex=lexical_similarity(bp,old)
                  if lex>=LEXICAL_DUPLICATE_THRESHOLD:
                      conflicts.append({'article_id':bp['article_id'],'owner':old['article_id'],'gate':'lexical','score':round(float(lex),4)})
                      break
                  st,_=structural_similarity(bp,old)
                  if st>=STRUCTURAL_DUPLICATE_THRESHOLD:
                      conflicts.append({'article_id':bp['article_id'],'owner':old['article_id'],'gate':'structural','score':round(float(st),4)})
                      break
          angle_counts={}
          for row in candidates:
              angle=str(row['blueprint'].get('information_gain_type') or 'legacy')
              angle_counts[angle]=angle_counts.get(angle,0)+1
          payload={
              'formal_inventory_before':plan['formal_inventory_before'],
              'target':200,
              'candidate_capacity_current_snapshot':plan['candidate_capacity_current_snapshot'],
              'capacity_exhaustive':plan['capacity_exhaustive'],
              'target_feasible_current_snapshot':plan['target_feasible_current_snapshot'],
              'attempt_budget':plan['attempt_budget'],
              'pool_duplicate_blocked':plan.get('pool_duplicate_blocked'),
              'pool_duplicate_gate_distribution':plan.get('pool_duplicate_gate_distribution'),
              'contract_mode_distribution':plan.get('contract_mode_distribution'),
              'angle_distribution_in_attempt_plan':angle_counts,
              'post_plan_pairwise_conflicts':conflicts,
              'lexical_threshold':LEXICAL_DUPLICATE_THRESHOLD,
              'structural_threshold':STRUCTURAL_DUPLICATE_THRESHOLD,
              'provider_calls':0,
              'website_sync':False,
              'scheduled':False,
              'published':False,
          }
          Path('audited-angle-contract-v1-capacity.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='post_plan_pairwise_conflicts'},ensure_ascii=False,indent=2))
          assert not conflicts, conflicts[:5]
          PY

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-angle-contract-v1-capacity
          path: audited-angle-contract-v1-capacity.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit validated integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/planner.py \
            engine/blueprints.py \
            engine/dedup.py \
            engine/semantic_dedup.py \
            engine/draft_packets.py \
            engine/ai_generation.py \
            engine/approval.py \
            engine/production_controller.py
          git commit -m "Integrate audited article angle contracts into production"
          git push origin HEAD:feature/audited-article-angle-contract-v1
