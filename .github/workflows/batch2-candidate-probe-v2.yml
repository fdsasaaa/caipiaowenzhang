name: batch2-candidate-probe-v2

on:
  pull_request:
    paths:
      - 'scripts/probe_batch2_ready_v2.py'
      - '.github/workflows/batch2-candidate-probe-v2.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify five source-backed case-ready families
        run: PYTHONPATH=. python scripts/probe_batch2_ready_v2.py
