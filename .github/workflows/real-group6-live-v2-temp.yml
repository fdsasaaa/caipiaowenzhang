name: real-group6-live-v2-temp

on:
  push:
    branches:
      - agent/real-group6-live-article
    paths:
      - '.github/real-group6-live-v2.trigger'

permissions:
  contents: read

jobs:
  validate-one-real-group6-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      OPENAI_BASE_URL: https://api.synapai.top/v1
      OPENAI_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify provider secret exists without printing it
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "MODEL_PROVIDER_API_KEY secret is not configured" >&2
            exit 2
          fi
          echo "Provider API key secret detected; value will not be printed."
      - name: Run exactly one real-family group6 article acceptance
        shell: bash
        run: python scripts/real_group6_live_article.py --output runtime/real-group6-live-v2
      - name: Upload real-family group6 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-group6-live-v2-evidence
          path: runtime/real-group6-live-v2
          if-no-files-found: error
          retention-days: 14
