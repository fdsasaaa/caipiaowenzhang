name: article-angle-variant-capacity-v2-temp

on:
  push:
    branches:
      - research/article-angle-capacity-v1
    paths:
      - '.github/article-angle-variant-capacity-v2.trigger'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Simulate audited information-gain variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from collections import Counter
          from pathlib import Path

          from engine.dedup import _core, duplicate_candidates
          from engine.semantic_dedup import structural_duplicate_candidates, structural_similarity
          from engine.seo_keywords import keyword_owners, normalize_keyword
          from engine.text import jaccard
          from scripts.produce_articles_total import _build_plan_with_capacity_retry

          LEX=0.72
          STRUCT=0.82
          ANGLE_WEIGHT=0.20
          TARGET=199
          ANGLES=(
              'mechanics_case',
              'space_math',
              'execution_checklist',
              'parameter_boundary',
              'multistage_order',
              'sample_provenance',
          )
          ANGLE_SUFFIX={
              'mechanics_case':'技巧',
              'space_math':'注数计算',
              'execution_checklist':'筛选步骤',
              'parameter_boundary':'参数设置',
              'multistage_order':'筛选顺序',
              'sample_provenance':'演示案例',
          }
          ANGLE_PRIORITY={name:i for i,name in enumerate(ANGLES)}

          plan=_build_plan_with_capacity_retry(TARGET,provider_id='',signals=[],batch_size=25,allow_ultra=False)
          bases=list(plan['candidates'])
          assert plan['formal_inventory_before']==1, plan
          assert plan['capacity_exhaustive'] is True, plan

          def result(bp):
              return ((bp.get('production_filter_contract') or {}).get('filter_pipeline_result') or {})
          def stages(bp): return list(result(bp).get('stages') or [])
          def has_sample(bp): return any(s.get('support_mode')=='synthetic_case_calculation' for s in stages(bp))
          def chain(bp): return '→'.join(str(s.get('label') or s.get('atom') or '') for s in stages(bp))
          def start_final_excluded(bp):
              r=result(bp); return int(r.get('starting_space') or 0),int(r.get('final_space') or 0),int(r.get('total_excluded') or 0)
          def pipeline_sig(bp):
              bits=[]
              for s in stages(bp):
                  p=s.get('params') or {}
                  safe=[]
                  for k in ('min','max','odd_count','big_count','has_repeat','pair_difference','lookback','top_n','threshold'):
                      if k in p: safe.append(f'{k}={p[k]}')
                  mode='sample' if s.get('support_mode')=='synthetic_case_calculation' else 'static'
                  bits.append(f"{s.get('atom')}[{','.join(safe)}]/{mode}]:{s.get('before_space')}->{s.get('after_space')}")
              return '>'.join(bits)
          def allowed_angles(bp):
              out=['mechanics_case','space_math','execution_checklist','parameter_boundary']
              if len(stages(bp))>=2: out.append('multistage_order')
              if has_sample(bp): out.append('sample_provenance')
              return out
          def keyword_stem(bp):
              kw=str(bp.get('primary_keyword') or '').strip()
              return kw[:-2] if kw.endswith('技巧') else kw
          def variant_id(bp, angle):
              if angle=='mechanics_case': return str(bp.get('article_id'))
              raw=f"{bp.get('fingerprint')}|angle={angle}|v1"
              return 'LCM-ANGLE-'+hashlib.sha256(raw.encode()).hexdigest()[:16]

          def title_and_intent(bp,angle,kw):
              ss=stages(bp); n=len(ss); c=chain(bp); start,final,excluded=start_final_excluded(bp)
              if angle=='mechanics_case':
                  return f"{kw}：{c}具体怎么算，用一个完整案例从{start}复算到{final}", f"理解{bp.get('subject_play')}里{c}分别计算什么，并用固定演示案例完整复算一次"
              if angle=='space_math':
                  return f"{kw}：{start}个候选为什么变成{final}个，排除{excluded}个怎么算", f"核对{bp.get('subject_play')}的候选空间计算，逐项确认{start}到{final}以及排除{excluded}个的确定性结果"
              if angle=='execution_checklist':
                  return f"{kw}：实际操作按哪几步做，筛到{final}个后什么时候必须停止", f"按固定顺序执行{c}，检查参数、候选空间和停止条件，形成可重复的人工操作清单"
              if angle=='parameter_boundary':
                  return f"{kw}：哪些参数先冻结，哪些数字只能由演示样本算出来", f"区分{bp.get('subject_play')}中系统预设参数与样本衍生结果，明确哪些条件生成前固定、哪些结果不能事后改"
              if angle=='multistage_order':
                  return f"{kw}：{n}层为什么按{c}这个顺序，逐层各排除多少", f"复算{n}层筛选的固定顺序、每层before/after/excluded，并说明完成最后一层后为什么停止"
              if angle=='sample_provenance':
                  sample=[s for s in ss if s.get('support_mode')=='synthetic_case_calculation'][0]
                  p=sample.get('params') or {}
                  lookback=p.get('lookback') or 12
                  return f"{kw}：近{lookback}期演示数据怎样生成数字池，为什么不能当成预测", f"只用演示样本复算{sample.get('label')}的数字池和空间变化，并区分样本计算、玩法规则与预测结论"
              raise AssertionError(angle)

          def make_variant(base_row,angle):
              bp=copy.deepcopy(base_row['blueprint'])
              stem=keyword_stem(bp)
              kw=stem+ANGLE_SUFFIX[angle]
              title,intent=title_and_intent(bp,angle,kw)
              start,final,excluded=start_final_excluded(bp)
              bp['article_id']=variant_id(bp,angle)
              bp['blueprint_id']='BP-'+bp['article_id'].split('-')[-1]
              bp['primary_keyword']=kw
              bp['title']=title
              bp['search_intent']=intent
              bp['information_gain_type']=angle
              bp['article_angle_contract_version']='1.0'
              bp['angle_deliverable']=angle
              bp['case_structure']=str(bp.get('case_structure') or '')+(
                  f";angle={angle};pipeline={pipeline_sig(bp)};start={start};final={final};excluded={excluded}"
              )
              return {
                  'priority_score':base_row['priority_score'],
                  'angle_priority':ANGLE_PRIORITY[angle],
                  'blueprint':bp,
              }

          variants=[]
          for base in bases:
              for angle in allowed_angles(base['blueprint']):
                  variants.append(make_variant(base,angle))

          # Exact-keyword ownership is fail-closed against current Registry and within the proposed pool.
          keyword_seen={}
          current_keyword_blocked=[]
          pool_keyword_blocked=[]
          lexical_current_blocked=[]
          eligible=[]
          for row in variants:
              bp=row['blueprint']; key=normalize_keyword(bp['primary_keyword'])
              owners=keyword_owners(bp['primary_keyword'],exclude_article_id=bp['article_id'])
              if owners:
                  current_keyword_blocked.append((bp['article_id'],bp['primary_keyword']))
                  continue
              if key in keyword_seen and keyword_seen[key]!=bp['article_id']:
                  pool_keyword_blocked.append((bp['article_id'],bp['primary_keyword'],keyword_seen[key]))
                  continue
              keyword_seen[key]=bp['article_id']
              lexical=duplicate_candidates(bp,threshold=LEX)
              structural=structural_duplicate_candidates(bp,threshold=STRUCT)
              # Legacy/current Registry receives NO angle-aware relaxation. If an existing
              # formal article says this is duplicate under today's rules, block it.
              if lexical or structural:
                  hit=(lexical[0] if lexical else structural[0])
                  lexical_current_blocked.append((bp['article_id'],'lexical' if lexical else 'structural',hit.article_id,round(float(hit.score),4)))
                  continue
              eligible.append(row)

          def audited_structural(a,b):
              base,_=structural_similarity(a,b)
              a_ok=a.get('article_angle_contract_version')=='1.0'
              b_ok=b.get('article_angle_contract_version')=='1.0'
              if not (a_ok and b_ok): return base
              at=str(a.get('information_gain_type') or '')
              bt=str(b.get('information_gain_type') or '')
              if at not in ANGLES or bt not in ANGLES: return base
              return (1.0-ANGLE_WEIGHT)*base + ANGLE_WEIGHT*(1.0 if at==bt else 0.0)

          def greedy(order_name, rows):
              if order_name=='base_priority_then_angle':
                  ordered=sorted(rows,key=lambda r:(-float(r['priority_score']),r['angle_priority'],r['blueprint']['article_id']))
              elif order_name=='angle_round_robin':
                  ordered=sorted(rows,key=lambda r:(r['angle_priority'],-float(r['priority_score']),r['blueprint']['article_id']))
              else: raise AssertionError(order_name)
              selected=[]; conflicts=[]
              for row in ordered:
                  bp=row['blueprint']; conflict=None
                  for chosen in selected:
                      old=chosen['blueprint']
                      lex=jaccard(_core(bp),_core(old))
                      if lex>=LEX:
                          conflict=('lexical',lex,old); break
                      st=audited_structural(bp,old)
                      if st>=STRUCT:
                          conflict=('structural',st,old); break
                  if conflict:
                      conflicts.append({
                          'article_id':bp['article_id'],'angle':bp['information_gain_type'],'primary_keyword':bp['primary_keyword'],
                          'subject_play':bp.get('subject_play'),'gate':conflict[0],'score':round(float(conflict[1]),4),
                          'owner_article_id':conflict[2].get('article_id'),'owner_angle':conflict[2].get('information_gain_type'),
                      })
                  else: selected.append(row)
              return {
                  'order':order_name,'selected':len(selected),'target_feasible':len(selected)>=TARGET,
                  'angle_distribution':dict(Counter(r['blueprint']['information_gain_type'] for r in selected)),
                  'play_distribution':dict(Counter(str(r['blueprint'].get('subject_play') or '') for r in selected)),
                  'conflict_count':len(conflicts),'conflict_gates':dict(Counter(x['gate'] for x in conflicts)),
                  'conflicts':conflicts,
                  'selected_preview':[{
                      'article_id':r['blueprint']['article_id'],'angle':r['blueprint']['information_gain_type'],
                      'primary_keyword':r['blueprint']['primary_keyword'],'title':r['blueprint']['title']
                  } for r in selected[:30]],
              }

          runs=[greedy('base_priority_then_angle',eligible),greedy('angle_round_robin',eligible)]
          payload={
              'formal_inventory_before':plan['formal_inventory_before'],
              'base_candidate_count':len(bases),
              'variant_count':len(variants),
              'allowed_angles':list(ANGLES),
              'angle_weight_research_only':ANGLE_WEIGHT,
              'lexical_threshold':LEX,'structural_threshold':STRUCT,
              'current_keyword_blocked':len(current_keyword_blocked),
              'pool_keyword_blocked':len(pool_keyword_blocked),
              'current_registry_duplicate_blocked':len(lexical_current_blocked),
              'provider_eligible_variants':len(eligible),
              'orders':runs,
              'provider_calls':0,
          }
          Path('article-angle-variant-capacity-v2.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          brief={k:v for k,v in payload.items() if k!='orders'}
          brief['orders']=[{k:v for k,v in x.items() if k not in {'conflicts','selected_preview','play_distribution'}} for x in runs]
          print(json.dumps(brief,ensure_ascii=False,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: article-angle-variant-capacity-v2
          path: article-angle-variant-capacity-v2.json
          retention-days: 30
