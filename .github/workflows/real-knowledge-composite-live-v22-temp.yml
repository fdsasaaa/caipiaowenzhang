name: real-knowledge-composite-live-v22-temp

on:
  push:
    branches:
      - agent/real-knowledge-composite-live-article
    paths:
      - '.github/real-knowledge-composite-live-v22.trigger'

permissions:
  contents: read

jobs:
  validate-one-composite-real-knowledge-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      OPENAI_BASE_URL: https://api.synapai.top/v1
      OPENAI_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify provider secret exists without printing it
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "MODEL_PROVIDER_API_KEY secret is not configured" >&2
            exit 2
          fi
          echo "Provider API key secret detected; value will not be printed."
      - name: Run exactly one composite real-knowledge article acceptance
        shell: bash
        run: python scripts/real_knowledge_composite_live_article_v22.py --output runtime/real-knowledge-composite-live-v22
      - name: Upload composite real-knowledge acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-knowledge-composite-live-v22-evidence
          path: runtime/real-knowledge-composite-live-v22
          if-no-files-found: error
          retention-days: 14
