name: production-v6-canary-temp

on:
  push:
    branches:
      - production/articles-200-20260813-v6
    paths:
      - '.github/production-v6-canary.trigger'

permissions:
  contents: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      OPENAI_BASE_URL: https://api.synapai.top/v1
      OPENAI_MODEL: gpt-5.4-mini
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preflight strict campaign capacity and hard-lock repaired canary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python -m engine.cli audit
          python scripts/audit_reader_terminology.py --root .
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.produce_articles_total import _build_plan_with_capacity_retry

          EXPECTED={
              'article_id':'LCM-IDEA-40be5a222f5cccf7',
              'primary_keyword':'分分彩五星直选跨度技巧',
              'subject_lottery':'分分彩',
              'subject_play':'五星直选',
              'family':'FAM-c93cfcc1527bf6f8',
              'source_refs':['BRBCW-002590'],
              'rule_refs':['SSC-HIST-MECH-5STAR-DIRECT-V1'],
              'contract_mode':'single_stage',
              'method_atoms':['span_range'],
              'method_atoms_covered':['span_range'],
              'starting_space':100000,
              'final_space':43620,
              'total_excluded':56380,
              'stage_count':1,
          }

          before=len(list(Path('articles/approved').glob('*.json')))
          assert before == 0, before
          campaign=_build_plan_with_capacity_retry(200,provider_id='',signals=[],batch_size=25,allow_ultra=False)
          assert campaign['capacity_exhaustive'] is True, campaign
          assert campaign['candidate_capacity_current_snapshot'] == 216, campaign
          assert campaign['target_feasible_current_snapshot'] is True, campaign
          assert campaign.get('contract_mode_distribution') == {'single_stage':86,'multistage':130}, campaign

          canary=_build_plan_with_capacity_retry(1,provider_id='',signals=[],batch_size=1,allow_ultra=False)
          assert canary['formal_inventory_before'] == 0, canary
          assert canary['candidates'], canary
          canary['candidates']=canary['candidates'][:1]
          canary['attempt_budget']=1
          bp=canary['candidates'][0]['blueprint']
          contract=bp.get('production_filter_contract') or {}
          pipeline=contract.get('filter_pipeline_result') or {}
          actual={
              'article_id':bp.get('article_id'),
              'primary_keyword':bp.get('primary_keyword'),
              'subject_lottery':bp.get('subject_lottery'),
              'subject_play':bp.get('subject_play'),
              'family':bp.get('technique_family'),
              'source_refs':bp.get('source_refs',[]),
              'rule_refs':bp.get('rule_refs',[]),
              'contract_mode':contract.get('mode'),
              'method_atoms':contract.get('method_atoms'),
              'method_atoms_covered':contract.get('method_atoms_covered'),
              'starting_space':pipeline.get('starting_space'),
              'final_space':pipeline.get('final_space'),
              'total_excluded':pipeline.get('total_excluded'),
              'stage_count':pipeline.get('stage_count'),
          }
          assert actual == EXPECTED, {'expected':EXPECTED,'actual':actual}
          stage=(pipeline.get('stages') or [None])[0]
          assert stage and stage.get('atom')=='span_range', stage
          assert stage.get('params')=={'min':2,'max':6}, stage
          assert stage.get('source_recommendation_claimed') is False, stage
          assert stage.get('predictive_advantage_claimed') is False, stage

          canary['target_new_formal_articles']=1
          payload={
              'formal_before':before,
              'campaign_capacity':campaign['candidate_capacity_current_snapshot'],
              'campaign_contract_modes':campaign.get('contract_mode_distribution',{}),
              'hard_locked_identity':actual,
              'filter_pipeline_result':pipeline,
              'provider_request_cap':1,
              'automatic_retry':False,
              'website_sync':False,
              'scheduled':False,
              'published':False,
          }
          Path('production-v6-canary-plan.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('production-v6-canary-execution-plan.json').write_text(json.dumps(canary,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

      - name: Execute exactly one provider request and capture response id
        id: execute
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json, os
          from pathlib import Path
          from engine.production_controller import execute_production_plan, _default_generator_for_packet
          from engine.provider_transport import make_responses_transport, normalize_base_url

          plan=json.loads(Path('production-v6-canary-execution-plan.json').read_text(encoding='utf-8'))
          assert len(plan['candidates']) == 1
          assert plan['attempt_budget'] == 1
          bp=plan['candidates'][0]['blueprint']
          assert bp['article_id']=='LCM-IDEA-40be5a222f5cccf7'
          assert bp['primary_keyword']=='分分彩五星直选跨度技巧'

          captured=[]
          def generate_with_response_capture(packet, **kwargs):
              generator=_default_generator_for_packet(packet)
              generation=generator(packet, **kwargs)
              captured.append({
                  'article_id':packet.get('article_id'),
                  'response_id':generation.response_id,
                  'provider':generation.provider,
                  'model':generation.model,
                  'contract_version':packet.get('contract_version'),
              })
              Path('production-v6-canary-provider.json').write_text(
                  json.dumps(captured,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
              )
              return generation

          transport=make_responses_transport(normalize_base_url(os.environ['OPENAI_BASE_URL']))
          result=execute_production_plan(
              plan,
              model=os.environ['OPENAI_MODEL'],
              transport=transport,
              generate_fn=generate_with_response_capture,
          )
          Path('production-v6-canary-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          summary={
              'status':result['status'],
              'stop_reason':result['stop_reason'],
              'attempted':result['attempted'],
              'generated':result['generated'],
              'approved':result['approved'],
              'staged':result['formal_inventory_staged'],
              'generation_failed':result['generation_failed'],
              'approval_failed':result['approval_failed'],
              'multistage_failed':result.get('multistage_failed',0),
              'terminology_failed':result['reader_terminology_failed'],
              'formal_inventory_errors':result['formal_inventory_error_count'],
              'quality_average':result['quality_score_average'],
              'editorial_average':result['editorial_score_average'],
              'multistage_average':result.get('multistage_score_average'),
              'provider_requests_captured':len(captured),
              'response_ids':[row.get('response_id') for row in captured],
              'provider_request_cap':1,
              'automatic_retry':False,
              'website_sync':False,
              'scheduled':False,
              'published':False,
          }
          Path('production-v6-canary-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          assert len(captured) <= 1, captured
          assert result['attempted'] <= 1, result
          assert result['generated'] <= 1, result
          PY
          rc=$?
          echo "$rc" > production-v6-canary-execute-rc.txt
          exit 0

      - name: Validate and persist only a fully passing repaired canary
        id: persist
        if: always()
        shell: bash
        run: |
          set +e
          python -m engine.cli audit > production-v6-canary-post-audit.json 2>&1
          audit_rc=$?
          python scripts/audit_reader_terminology.py --root . > production-v6-canary-terminology.json 2>&1
          python - <<'PY' > production-v6-canary-inventory.json 2>&1
          import hashlib,json
          from pathlib import Path
          result_path=Path('production-v6-canary-result.json')
          provider_path=Path('production-v6-canary-provider.json')
          if not result_path.exists() or not provider_path.exists():
              raise SystemExit(8)
          result=json.loads(result_path.read_text(encoding='utf-8'))
          provider=json.loads(provider_path.read_text(encoding='utf-8'))
          paths=sorted(Path('articles/approved').glob('*.json'))
          errors=[]
          if result.get('attempted') != 1: errors.append('attempted_not_one')
          if result.get('generated') != 1: errors.append('generated_not_one')
          if result.get('approved') != 1: errors.append('approved_not_one')
          if result.get('formal_inventory_staged') != 1: errors.append('staged_not_one')
          if len(provider) != 1: errors.append(f'provider_count={len(provider)}')
          elif not provider[0].get('response_id'): errors.append('response_id_missing')
          if len(paths) != 1: errors.append(f'formal_count={len(paths)}')
          for p in paths:
              row=json.loads(p.read_text(encoding='utf-8'))
              if row.get('article_id')!='LCM-IDEA-40be5a222f5cccf7': errors.append('wrong_article_id')
              if row.get('primary_keyword')!='分分彩五星直选跨度技巧': errors.append('wrong_primary_keyword')
              if row.get('status')!='approved': errors.append('status')
              if row.get('subject_lottery')!='分分彩': errors.append('subject_lottery')
              if row.get('site_category_key')!='tzjq': errors.append('site_category_key')
              content=str(row.get('content') or '')
              expected=hashlib.sha256(content.encode()).hexdigest()
              if row.get('content_hash')!=expected: errors.append('content_hash')
              for field in ('title','seo_title','meta_description','primary_keyword'):
                  if '时时彩' in str(row.get(field) or ''): errors.append('legacy_term:'+field)
          payload={'formal_count':len(paths),'provider':provider,'errors':errors,'website_sync':False,'scheduled':False,'published':False}
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          raise SystemExit(0 if not errors else 9)
          PY
          inv_rc=$?
          if [ "$audit_rc" -eq 0 ] && [ "$term_rc" -eq 0 ] && [ "$inv_rc" -eq 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles/approved registry/articles.jsonl
            if git diff --cached --quiet; then
              echo "Expected one staged formal article but git diff is empty" >&2
              echo "persisted=false" >> "$GITHUB_OUTPUT"
            else
              git commit -m "Stage repaired strict V6 production canary (1/200)"
              git push origin HEAD:production/articles-200-20260813-v6
              echo "persisted=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload complete V6 canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-v6-canary
          path: |
            production-v6-canary*.json
            production-v6-canary-execute-rc.txt
            articles/approved/*.json
            registry/articles.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce repaired canary acceptance after evidence preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.persist.outputs.persisted }}" = "true"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('production-v6-canary-summary.json').read_text(encoding='utf-8'))
          assert s['attempted']==1, s
          assert s['generated']==1, s
          assert s['approved']==1, s
          assert s['staged']==1, s
          assert s['provider_requests_captured']==1, s
          assert len(s['response_ids'])==1 and s['response_ids'][0], s
          assert s['quality_average']==100, s
          assert s['editorial_average']==100, s
          assert s['formal_inventory_errors']==0, s
          assert s['terminology_failed']==0, s
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
