name: production-primary-filter-single-acceptance-temp

on:
  push:
    branches:
      - production/primary-filter-acceptance-20260813-v1
    paths:
      - .github/production-primary-filter-single-acceptance.trigger

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      OPENAI_BASE_URL: https://api.synapai.top/v1
      OPENAI_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preflight one machine-bound candidate
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python -m engine.cli audit
          python - <<'PY' | tee production-primary-filter-single-preflight.json
          import json
          from scripts.produce_articles_total import _build_plan_with_capacity_retry
          plan=_build_plan_with_capacity_retry(1, provider_id='', signals=[], batch_size=None, allow_ultra=False)
          row=plan['candidates'][0]
          bp=row['blueprint']
          spec=bp.get('primary_filter_spec')
          assert isinstance(spec,dict)
          assert 0 < spec['after_filter_space'] < spec['starting_space']
          print(json.dumps({
              'article_id':bp['article_id'],
              'primary_keyword':bp['primary_keyword'],
              'subject_play':bp['subject_play'],
              'technique_atoms':bp['technique_atoms'],
              'primary_filter_spec':spec,
              'provider_calls_planned':1,
              'formal_inventory_before':plan['formal_inventory_before'],
          },ensure_ascii=False,indent=2))
          PY

      - name: Execute exactly one provider call
        run: |
          set -euo pipefail
          python - <<'PY' | tee production-primary-filter-single-result.log
          import json
          from pathlib import Path
          from scripts.produce_articles_total import _build_plan_with_capacity_retry, _provider_transport_from_environment
          from engine.production_controller import execute_production_plan

          plan=_build_plan_with_capacity_retry(1, provider_id='', signals=[], batch_size=None, allow_ultra=False)
          plan=dict(plan)
          plan['candidates']=plan['candidates'][:1]
          plan['attempt_budget']=1
          plan['batch_size']=1
          transport, base_url=_provider_transport_from_environment()
          assert transport is not None
          result=execute_production_plan(plan, model='gpt-5.4-mini', transport=transport)
          payload={
              'base_url':base_url,
              'target':1,
              'attempted':result['attempted'],
              'generated':result['generated'],
              'approved':result['approved'],
              'formal_inventory_staged':result['formal_inventory_staged'],
              'approval_failed':result['approval_failed'],
              'generation_failed':result['generation_failed'],
              'reader_terminology_failed':result['reader_terminology_failed'],
              'quality_score_average':result['quality_score_average'],
              'editorial_score_average':result['editorial_score_average'],
              'results':result['results'],
              'website_sync':False,
              'scheduled':False,
              'published':False,
          }
          Path('runs/production-primary-filter-single').mkdir(parents=True,exist_ok=True)
          Path('runs/production-primary-filter-single/result.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          assert result['attempted']==1
          assert result['generated']==1
          assert result['approved']==1, result['results']
          assert result['formal_inventory_staged']==1, result['results']
          PY

      - name: Validate and commit accepted article
        run: |
          set -euo pipefail
          python -m engine.cli audit
          python scripts/audit_reader_terminology.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=sorted(Path('articles/approved').glob('*.json'))
          assert len(paths)==1, len(paths)
          row=json.loads(paths[0].read_text(encoding='utf-8'))
          assert row['status']=='approved'
          assert row['site_category_key']=='tzjq'
          assert row['subject_lottery']=='分分彩'
          assert row['content_hash']==hashlib.sha256(row['content'].encode('utf-8')).hexdigest()
          print(json.dumps({'article_id':row['article_id'],'primary_keyword':row['primary_keyword'],'title':row['title']},ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/approved registry/articles.jsonl
          git commit -m "Stage machine-filter production acceptance article (1/200)"
          git push origin HEAD:production/primary-filter-acceptance-20260813-v1

      - name: Upload one-call evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-primary-filter-single-acceptance
          path: |
            production-primary-filter-single-preflight.json
            production-primary-filter-single-result.log
            runs/production-primary-filter-single/
            articles/approved/*.json
            registry/articles.jsonl
          if-no-files-found: warn
          retention-days: 30
