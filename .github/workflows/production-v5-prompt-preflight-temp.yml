name: production-v5-prompt-preflight-temp

on:
  push:
    branches:
      - production/articles-200-20260813-v5
    paths:
      - '.github/production-v5-prompt-preflight.trigger'

permissions:
  contents: read

jobs:
  prompt-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build hard-locked canary packet and audit source/system parameter ownership
        shell: bash
        run: |
          mkdir -p runtime/production-v5-prompt-preflight
          python - <<'PY' | tee runtime/production-v5-prompt-preflight/summary.json
          import json
          from engine.ai_generation import build_generation_prompt
          from engine.production_controller import _packet_with_cluster_metadata
          from scripts.produce_articles_total import _build_plan_with_capacity_retry

          plan=_build_plan_with_capacity_retry(1,provider_id='',signals=[],batch_size=1,allow_ultra=False)
          assert plan['candidates']
          bp=plan['candidates'][0]['blueprint']
          assert bp['article_id']=='LCM-IDEA-40be5a222f5cccf7', bp['article_id']
          packet=_packet_with_cluster_metadata(bp)
          facts=packet['immutable_facts']
          spec=packet['practicality']['primary_filter_spec']
          source_use=packet['source_use']
          prompt=build_generation_prompt(packet)

          assert facts['subject_lottery']=='分分彩', facts
          assert facts['source_refs']==['BRBCW-002590'], facts
          assert facts['rule_refs']==['SSC-HIST-MECH-5STAR-DIRECT-V1'], facts
          assert spec['atom']=='span_range', spec
          assert spec['params']=={'min':2,'max':6}, spec
          assert spec['starting_space']==100000, spec
          assert spec['after_filter_space']==43620, spec
          assert spec['excluded_space']==56380, spec
          assert spec['basis']=='experimental_parameter', spec
          assert spec['source_recommendation_claimed'] is False, spec
          assert spec['predictive_advantage_claimed'] is False, spec
          assert source_use['production_parameter_owner']=='system_research', source_use
          assert source_use['production_parameter_source_attribution_allowed'] is False, source_use
          instruction=source_use['production_parameter_instruction']
          assert 'source_refs只支持 broad 技巧家族/原子来源归属' in instruction, instruction
          assert '不得把任何这些具体参数写成来源推荐、来源指定或原文参数' in instruction, instruction
          assert '分分彩' in prompt
          assert 'BRBCW-002590' in prompt
          assert 'system_research' in prompt
          assert 'production_parameter_source_attribution_allowed' in prompt
          assert '43620' in prompt and '56380' in prompt and '100000' in prompt

          result={
              'article_id':bp['article_id'],
              'primary_keyword':bp['primary_keyword'],
              'subject_lottery':facts['subject_lottery'],
              'source_refs':facts['source_refs'],
              'rule_refs':facts['rule_refs'],
              'primary_filter_spec':spec,
              'production_parameter_owner':source_use['production_parameter_owner'],
              'source_parameter_attribution_allowed':source_use['production_parameter_source_attribution_allowed'],
              'prompt_contains_system_research':True,
              'prompt_contains_exact_machine_spaces':True,
              'provider_calls':0,
              'website_sync':False,
              'scheduled':False,
              'published':False,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload prompt-preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-v5-prompt-preflight
          path: runtime/production-v5-prompt-preflight
          if-no-files-found: error
          retention-days: 14
