name: actions-pr-permission-smoke

on:
  push:
    branches:
      - test/actions-pr-permission-smoke-20260817

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create permission smoke PR
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "Test: GitHub Actions PR permission smoke" \
            --body "One-time permission smoke test. Do not merge. No article, Approved parent, public-r1, website, CMS, Publisher, schedule or cron changes are involved."
