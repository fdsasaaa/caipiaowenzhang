name: patch-production-live-dedup-audit-v2-temp

on:
  push:
    branches:
      - fix/production-live-dedup-response-audit-v1
    paths:
      - '.github/patch-production-live-dedup-audit-v2.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply narrow patch
        run: python scripts/_temp_apply_live_dedup_response_patch.py
      - name: Run targeted regression
        run: python -m pytest -q tests/test_production_controller.py tests/test_approval.py tests/test_dedup.py tests/test_semantic_dedup.py
      - name: Run full offline CI
        shell: bash
        run: |
          set -euo pipefail
          python -m engine.cli audit
          python scripts/audit_reader_terminology.py --root .
          python -m pytest -q
      - name: Commit code and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/production_controller.py engine/approval.py tests/test_production_controller.py
          git commit -m "Preflight live duplicates and persist provider response ids"
          git push origin HEAD:fix/production-live-dedup-response-audit-v1
