name: title-seo-upgrade-apply

on:
  push:
    branches:
      - feature/title-seo-gates-v1

permissions:
  contents: write

concurrency:
  group: title-seo-upgrade-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/title-seo-gates-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Title SEO integration and generate audit
        run: python scripts/apply_title_seo_upgrade.py
      - name: Compile patched modules
        run: |
          python -m py_compile \
            engine/title_seo.py \
            engine/generation_normalization.py \
            engine/production_controller.py \
            engine/ai_generation.py \
            engine/approval.py \
            engine/creator_first.py \
            engine/formal_approved_inventory.py \
            engine/daily_website_ready.py \
            engine/public_release_revision.py
      - name: Commit migration output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine scripts agent/results
          git commit -m "Title SEO: integrate gates and generate formal inventory audit"
          git push origin HEAD:feature/title-seo-gates-v1
