name: Fix Creator Batch Contract

on:
  push:
    branches:
      - production/creator-first-50-20260813
    paths:
      - .github/workflows/fix-creator-batch-contract.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creator-first-50-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize article packages
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = sorted(Path('articles/approved').glob('LCM-CREATOR-cf50-20260813-*.json'))
          assert len(files) == 50, len(files)
          replacements = {
              '这里没有使用真实平台奖金、返点或赔率，也没有把这套筛选说成未来更容易命中。它只是一个研究型投注技巧。':
                  '这只是一个研究型投注技巧，用来说明选号结构和执行纪律，不用于证明未来预测优势。',
              '48组只是演示规模。实际平台的单注金额、奖金和限额没有在这里核验，所以不把48组换算成具体人民币收益。':
                  '48组只是演示规模。本篇只讨论组合结构，不讨论平台经济参数。',
              '没有已核验奖金和返点时，不能证明这个路径能回本；它只证明最大暴露被预先限制。':
                  '这条路径只用于限制最大暴露，不用于证明能够回本。',
          }
          for path in files:
              package = json.loads(path.read_text(encoding='utf-8'))
              package['seo_title'] = package['title']
              content = package['content']
              for old, new in replacements.items():
                  content = content.replace(old, new)
              package['content'] = content
              package['content_hash'] = hashlib.sha256(content.encode('utf-8')).hexdigest()
              path.write_text(json.dumps(package, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit normalized article packages
        run: |
          if git diff --quiet -- articles/approved; then
            echo 'No article changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/approved/LCM-CREATOR-cf50-20260813-*.json
          git commit -m 'Normalize Creator-first article package contract'
          git push origin HEAD:production/creator-first-50-20260813
