name: production-batch25-01-temp

on:
  push:
    branches:
      - production/articles-200-20260813-v4
    paths:
      - .github/production-batch25-01.trigger

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      OPENAI_BASE_URL: https://api.synapai.top/v1
      OPENAI_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Preflight campaign inventory and capacity
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python -m engine.cli audit
          python scripts/audit_reader_terminology.py --root .
          python - <<'PY' | tee production-batch25-01-preflight.json
          import json
          from pathlib import Path
          from scripts.produce_articles_total import _build_plan_with_capacity_retry
          before=len(list(Path('articles/approved').glob('*.json')))
          assert before==1, before
          plan=_build_plan_with_capacity_retry(25,provider_id='',signals=[],batch_size=25,allow_ultra=False)
          assert plan['formal_inventory_before']==1
          assert plan['candidate_capacity_current_snapshot']>=25
          assert plan['target_feasible_current_snapshot'] is True
          assert all(isinstance(x['blueprint'].get('primary_filter_spec'),dict) for x in plan['candidates'])
          print(json.dumps({'formal_before':before,'target_new':25,'candidate_capacity':plan['candidate_capacity_current_snapshot'],'attempt_budget':plan['attempt_budget'],'capacity_exhaustive':plan['capacity_exhaustive'],'website_sync':False,'scheduled':False,'published':False},ensure_ascii=False,indent=2))
          PY

      - name: Execute first 25-new-article controller batch
        id: execute
        run: |
          set +e
          rm -rf runs/production-batch25-01
          python scripts/produce_articles_total.py 25 \
            --execute \
            --batch-size 25 \
            --model gpt-5.4-mini \
            --output-dir runs/production-batch25-01 \
            2>&1 | tee production-batch25-01.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > production-batch25-01-exit-code.txt
          echo "controller_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and commit every passing formal article
        id: validate
        if: always()
        run: |
          set +e
          python -m engine.cli audit > production-batch25-01-post-audit.json 2>&1
          audit_rc=$?
          python scripts/audit_reader_terminology.py --root . > production-batch25-01-terminology.json 2>&1
          term_rc=$?
          python - <<'PY' > production-batch25-01-inventory.json 2>&1
          import hashlib,json
          from pathlib import Path
          paths=sorted(Path('articles/approved').glob('*.json'))
          errors=[]; ids=set(); kws=set()
          for p in paths:
              row=json.loads(p.read_text(encoding='utf-8'))
              aid=str(row.get('article_id') or '')
              kw=''.join(str(row.get('primary_keyword') or '').split()).casefold()
              if row.get('status')!='approved': errors.append(f'{p}: status')
              if row.get('subject_lottery')!='分分彩': errors.append(f'{p}: subject')
              if row.get('site_category_key')!='tzjq': errors.append(f'{p}: category')
              if row.get('content_hash')!=hashlib.sha256(str(row.get('content') or '').encode()).hexdigest(): errors.append(f'{p}: hash')
              if aid in ids: errors.append(f'{p}: duplicate id')
              ids.add(aid)
              if kw in kws: errors.append(f'{p}: duplicate keyword')
              kws.add(kw)
          print(json.dumps({'formal_count':len(paths),'unique_ids':len(ids),'unique_keywords':len(kws),'errors':errors,'website_sync':False,'scheduled':False,'published':False},ensure_ascii=False,indent=2))
          raise SystemExit(0 if not errors and len(paths)>=1 else 3)
          PY
          inv_rc=$?
          if [ "$audit_rc" -eq 0 ] && [ "$term_rc" -eq 0 ] && [ "$inv_rc" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles/approved registry/articles.jsonl
            if ! git diff --cached --quiet; then
              count=$(find articles/approved -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
              git commit -m "Stage production articles through batch 01 (${count}/200)"
              git push origin HEAD:production/articles-200-20260813-v4
            fi
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload batch evidence and recovery inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-batch25-01
          path: |
            runs/production-batch25-01/
            production-batch25-01*.json
            production-batch25-01*.log
            production-batch25-01-exit-code.txt
            articles/approved/*.json
            registry/articles.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce batch target only after preserving valid outputs
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.validate.outputs.valid }}" = "true"
          test -f runs/production-batch25-01/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runs/production-batch25-01/summary.json').read_text(encoding='utf-8'))
          inv=json.loads(Path('production-batch25-01-inventory.json').read_text(encoding='utf-8'))
          assert s['formal_inventory_staged']==25, s
          assert inv['formal_count']==26, inv
          assert inv['unique_ids']==26 and inv['unique_keywords']==26
          print(json.dumps({'status':s['status'],'attempted':s['attempted'],'generated':s['generated'],'approved':s['approved'],'staged_new':s['formal_inventory_staged'],'formal_total':inv['formal_count'],'approval_failed':s['approval_failed'],'generation_failed':s['generation_failed'],'terminology_failed':s['reader_terminology_failed'],'quality_average':s['quality_score_average'],'editorial_average':s['editorial_score_average']},ensure_ascii=False,indent=2))
          PY
